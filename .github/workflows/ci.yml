name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Check no secrets leaked
        run: |
          if grep -rn "NEO4J_URI\s*=\s*neo4j" src/ scripts/ app.py 2>/dev/null; then
            echo "Hardcoded Neo4j URI found — use env vars"; exit 1
          fi
          echo "No hardcoded secrets found."
