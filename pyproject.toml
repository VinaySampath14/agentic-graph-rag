[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-graph-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5.20",
  "qdrant-client>=1.9",
  "langgraph>=0.2",
  "langchain-groq>=0.1",
  "arxiv>=2.1",
  "spacy>=3.7",
  "networkx>=3.3",
  "fastembed>=0.3",
  "FlagEmbedding>=1.2",
  "sentence-transformers>=3.0",
  "tavily-python>=0.3",
  "ragas>=0.1",
  "mlflow>=2.13",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "gradio>=4.37",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "rdflib>=7.0",
  "owlrl>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "hypothesis>=6.100", "pytest-asyncio>=0.23", "ruff>=0.4"]
ingestion = ["leidenalg>=0.10", "igraph>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"
